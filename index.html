// ---------- localStorage を window.storage 互換にするラッパー ----------
// (Claude artifact 専用の window.storage API を、ふつうのブラウザの
//  localStorage で再現しています。挙動:
//   get(key) -> {key, value} か、無ければ null
//   set(key, value) -> {key, value}
window.storage = {
  async get(key) {
    try {
      const v = localStorage.getItem(key);
      if (v === null) return null;
      return { key, value: v };
    } catch (e) {
      return null;
    }
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
};

function getMatchedHints(question) {
  const text = [question.passage, question.a, question.b, question.prompt].filter(Boolean).join("");
  return KEYWORD_RULES.filter((r) => r.keywords.some((k) => text.includes(k)));
}

// ---------- モード1「手がかりのつながり」を自動生成 ----------
const RELATION_TYPES = [
  { key: "contrast", label: "対比", optionLabel: "2つを比べている(対比)", signals: ["それに対して", "一方", "しかし"] },
  { key: "reason", label: "理由", optionLabel: "前の理由を言っている", signals: ["なぜなら", "からだ", "ので"] },
  { key: "example", label: "具体例", optionLabel: "前の具体例をあげている", signals: ["たとえば"] },
  { key: "addition", label: "追加", optionLabel: "前に話をたしている", signals: ["さらに", "また", "そのうえ"] },
  { key: "summary", label: "まとめ・言いかえ", optionLabel: "前をまとめている", signals: ["つまり", "このように", "こうして"] },
];

function buildRelationQuestion({ a, b, correctKey, signal }) {
  const options = RELATION_TYPES.map((rt) => {
    if (rt.key === correctKey) {
      return { text: rt.optionLabel, correct: true, note: `○「${signal}」は${rt.label}のことば。だから${rt.label}だよ。` };
    }
    return { text: rt.optionLabel, correct: false, note: `×${rt.label}なら「${rt.signals[0]}」が入るはず。でも「${signal}」があるから、${rt.label}じゃないよ。` };
  });
  return { a, b, prompt: "証言Bは、証言Aとどんな関係かな?", options };
}

// ---------- 20日間カリキュラム用データ ----------
const TOTAL_DAYS = 20;
const QUESTIONS_PER_DAY = 16; // 目安60分(1問あたり読む・考える・ヒント・解説で約3〜4分)

const ALL_QUESTIONS = MODES.flatMap((m) =>
  m.questions.map((q, i) => ({ ...q, modeId: m.id, modeTitle: m.title, modeAccent: m.accent, uid: `${m.id}-${i}` }))
);

function seededShuffle(array, seed) {
  const arr = array.slice();
  let s = seed >>> 0;
  const rand = () => {
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    return s / 4294967296;
  };
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ノーリピートローテーション:
// 全問題を1回ずつ出し切ってから(1周)、次の周でまた全問シャッフルして出す。
// そのため「1周」の間は同じ問題が2回出ることはない。
const lapCache = {};
function getLapShuffle(lap) {
  if (!lapCache[lap]) lapCache[lap] = seededShuffle(ALL_QUESTIONS, lap * 104729 + 7);
  return lapCache[lap];
}

function getDayQuestions(day) {
  const poolSize = ALL_QUESTIONS.length;
  const start = (day - 1) * QUESTIONS_PER_DAY;
  const end = start + QUESTIONS_PER_DAY;
  const result = [];
  let idx = start;
  while (idx < end) {
    const lap = Math.floor(idx / poolSize);
    const posInLap = idx % poolSize;
    const lapShuffled = getLapShuffle(lap);
    const takeCount = Math.min(poolSize - posInLap, end - idx);
    result.push(...lapShuffled.slice(posInLap, posInLap + takeCount));
    idx += takeCount;
  }
  return result;
}

function todayISODate() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function formatMMSS(totalSec) {
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

const DATA_KEY = "detective-curriculum-data";
// data shape: { logs: [{date, day, mode, correct}], dayStatus: { [day]: {completed, correctCount, totalCount, timeSec, lastPlayedISO, playCount} } }

function downloadTextFile(filename, text) {
  try {
    const blob = new Blob([text], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return true;
  } catch (e) {
    return false;
  }
}

function ReadingDetectiveApp() {
  const [screen, setScreen] = useState("home"); // home | quiz | result | day | daySummary | parent
  const [modeIdx, setModeIdx] = useState(0);
  const [qIdx, setQIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [correctCount, setCorrectCount] = useState(0);

  const [data, setData] = useState({ logs: [], dayStatus: {} });
  const [loaded, setLoaded] = useState(false);

  const [dayNumber, setDayNumber] = useState(1);
  const [dayQuestions, setDayQuestions] = useState([]);
  const [dayIdx, setDayIdx] = useState(0);
  const [daySelected, setDaySelected] = useState(null);
  const [daySessionAnswers, setDaySessionAnswers] = useState([]); // {mode, correct}
  const [dayElapsedSec, setDayElapsedSec] = useState(0);
  const timerRef = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(DATA_KEY, false);
        if (res && res.value) setData(JSON.parse(res.value));
      } catch (e) {
        // no saved data yet
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  const saveData = async (next) => {
    setData(next);
    try {
      await window.storage.set(DATA_KEY, JSON.stringify(next), false);
    } catch (e) {
      // ignore
    }
  };

  // ---- 自由練習モード用 ----
  const mode = MODES[modeIdx];
  const question = mode ? mode.questions[qIdx] : null;

  const startMode = (idx) => {
    setModeIdx(idx);
    setQIdx(0);
    setSelected(null);
    setCorrectCount(0);
    setScreen("quiz");
  };

  const choose = (i) => {
    if (selected !== null) return;
    setSelected(i);
    if (question.options[i].correct) setCorrectCount((c) => c + 1);
  };

  const next = () => {
    if (qIdx + 1 < mode.questions.length) {
      setQIdx(qIdx + 1);
      setSelected(null);
    } else {
      setScreen("result");
    }
  };

  // ---- 20日間カリキュラム用 ----
  const nextRecommendedDay = () => {
    for (let d = 1; d <= TOTAL_DAYS; d++) {
      if (!data.dayStatus[d]?.completed) return d;
    }
    return TOTAL_DAYS;
  };

  const startDay = (d) => {
    setDayNumber(d);
    setDayQuestions(getDayQuestions(d));
    setDayIdx(0);
    setDaySelected(null);
    setDaySessionAnswers([]);
    setDayElapsedSec(0);
    setScreen("day");
  };

  useEffect(() => {
    if (screen !== "day") {
      if (timerRef.current) clearInterval(timerRef.current);
      return;
    }
    timerRef.current = setInterval(() => setDayElapsedSec((s) => s + 1), 1000);
    return () => clearInterval(timerRef.current);
  }, [screen]);

  const chooseDayAnswer = (i) => {
    if (daySelected !== null) return;
    setDaySelected(i);
    const q = dayQuestions[dayIdx];
    const correct = q.options[i].correct;
    setDaySessionAnswers((prev) => [...prev, { mode: q.modeId, correct }]);
  };

  const finishDaySession = async (answers, completedFully) => {
    const total = answers.length;
    const correct = answers.filter((a) => a.correct).length;
    const date = todayISODate();
    const newLogs = answers.map((a) => ({ date, day: dayNumber, mode: a.mode, correct: a.correct }));
    const prevStatus = data.dayStatus[dayNumber] || { correctCount: 0, totalCount: 0, timeSec: 0, playCount: 0, completed: false };
    const nextStatus = {
      ...prevStatus,
      correctCount: prevStatus.correctCount + correct,
      totalCount: prevStatus.totalCount + total,
      timeSec: prevStatus.timeSec + dayElapsedSec,
      playCount: (prevStatus.playCount || 0) + 1,
      lastPlayedISO: date,
      completed: prevStatus.completed || completedFully,
    };
    const nextData = {
      logs: [...data.logs, ...newLogs],
      dayStatus: { ...data.dayStatus, [dayNumber]: nextStatus },
    };
    await saveData(nextData);
    setScreen("daySummary");
  };

  const nextDayQuestion = () => {
    if (dayIdx + 1 < dayQuestions.length) {
      setDayIdx(dayIdx + 1);
      setDaySelected(null);
    } else {
      finishDaySession(daySessionAnswers, true);
    }
  };

  const stopDayEarly = () => {
    finishDaySession(daySessionAnswers, false);
  };

  return (
    <div className="min-h-screen w-full" style={{ backgroundColor: CORK }}>
      <div className="max-w-3xl mx-auto px-4 py-8">
        {screen === "home" && (
          <Home
            data={data}
            loaded={loaded}
            onStart={startMode}
            onStartDay={startDay}
            nextDay={nextRecommendedDay()}
            onOpenParent={() => setScreen("parent")}
          />
        )}
        {screen === "quiz" && mode && question && (
          <Quiz mode={mode} qIdx={qIdx} question={question} selected={selected} onChoose={choose} onNext={next} onBack={() => setScreen("home")} />
        )}
        {screen === "result" && mode && (
          <Result mode={mode} score={correctCount} total={mode.questions.length} onRetry={() => startMode(modeIdx)} onHome={() => setScreen("home")} />
        )}
        {screen === "day" && dayQuestions[dayIdx] && (
          <DaySession
            dayNumber={dayNumber}
            total={dayQuestions.length}
            idx={dayIdx}
            question={dayQuestions[dayIdx]}
            selected={daySelected}
            elapsedSec={dayElapsedSec}
            onChoose={chooseDayAnswer}
            onNext={nextDayQuestion}
            onStopEarly={stopDayEarly}
            onBack={() => setScreen("home")}
          />
        )}
        {screen === "daySummary" && (
          <DaySummary
            dayNumber={dayNumber}
            answers={daySessionAnswers}
            elapsedSec={dayElapsedSec}
            onHome={() => setScreen("home")}
          />
        )}
        {screen === "parent" && <ParentDashboard data={data} onBack={() => setScreen("home")} />}
      </div>
    </div>
  );
}

  return (
    <div className="space-y-3">
      {question.options.map((opt, i) => {
        const isSelected = selected === i;
        const showResult = selected !== null;
        let style = { backgroundColor: "#fff", borderColor: `${INK}33`, color: INK };
        if (showResult && opt.correct) style = { backgroundColor: `${GOOD}1A`, borderColor: GOOD, color: INK };
        if (showResult && isSelected && !opt.correct) style = { backgroundColor: `${BAD}1A`, borderColor: BAD, color: INK };
        return (
          <button
            key={i}
            disabled={selected !== null}
            onClick={() => onChoose(i)}
            className="w-full text-left rounded-md border-2 px-4 py-3 text-sm font-medium transition-colors focus:outline-none focus-visible:ring-4 focus-visible:ring-yellow-300 flex items-start gap-2"
            style={style}
          >
            {showResult && opt.correct && <CheckCircle2 size={18} color={GOOD} className="mt-0.5 shrink-0" />}
            {showResult && isSelected && !opt.correct && <XCircle size={18} color={BAD} className="mt-0.5 shrink-0" />}
            <span>{opt.text}</span>
          </button>
        );
      })}
    </div>
  );
}

function AnswerFeedback({ question, selected, notesToShow, onNext, isLast }) {
  const [diagramOpen, setDiagramOpen] = useState(true);
  const hasStructure = Array.isArray(question.structure) && question.structure.length > 0;
  const mainText = hasStructure ? question.options.find((o) => o.correct)?.text : null;
  return (
    <div className="mt-4 space-y-2">
      <div
        className="rounded-md px-4 py-2 text-sm font-bold"
        style={{
          backgroundColor: question.options[selected].correct ? `${GOOD}14` : `${BAD}14`,
          color: question.options[selected].correct ? GOOD : BAD,
          border: `1px solid ${question.options[selected].correct ? GOOD : BAD}55`,
        }}
      >
        {question.options[selected].correct ? "せいかい!" : "ざんねん、まちがいだよ。"}
      </div>
      {notesToShow.map((i) => {
        const opt = question.options[i];
        return (
          <div key={i} className="rounded-md px-4 py-3 text-sm flex items-start gap-2" style={{ backgroundColor: "#fff", border: `1px solid ${opt.correct ? GOOD : BAD}44` }}>
            {opt.correct ? <CheckCircle2 size={16} color={GOOD} className="mt-0.5 shrink-0" /> : <XCircle size={16} color={BAD} className="mt-0.5 shrink-0" />}
            <div>
              <p className="font-semibold flex items-center gap-2 flex-wrap" style={{ color: opt.correct ? GOOD : BAD }}>
                {opt.text}
                {i === selected && !opt.correct && (
                  <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full" style={{ backgroundColor: INK, color: "#fff" }}>
                    あなたの答え
                  </span>
                )}
              </p>
              <p className="mt-0.5" style={{ color: INK, opacity: 0.85 }}>
                {opt.note}
              </p>
            </div>
          </div>
        );
      })}

      {hasStructure && (
        <>
          <button
            onClick={() => setDiagramOpen((v) => !v)}
            className="flex items-center gap-1.5 text-xs font-bold rounded-full px-3 py-1.5 focus:outline-none focus-visible:ring-4 focus-visible:ring-yellow-300"
            style={{ backgroundColor: `${BRASS}1F`, color: BRASS, border: `1px solid ${BRASS}66` }}
          >
            <FileText size={14} />
            {diagramOpen ? "考え方と図をとじる" : "考え方と図を見る"}
          </button>
          {diagramOpen && (
            <>
              <SummaryStepsGuide />
              <StructureDiagram structure={question.structure} mainText={mainText} />
            </>
          )}
        </>
      )}

      <button onClick={onNext} className="mt-1 w-full sm:w-auto rounded-md px-5 py-2 font-bold text-white focus:outline-none focus-visible:ring-4 focus-visible:ring-yellow-300" style={{ backgroundColor: INK }}>
        {isLast ? "結果を見る" : "次の事件へ"}
      </button>
    </div>
  );
}

function ClueCard({ label, text, accent }) {

    <div className="rounded-sm px-4 py-3" style={{ backgroundColor: "#fff", borderLeft: `4px solid ${accent}` }}>
      <p className="text-[11px] font-bold tracking-wide mb-1" style={{ color: accent }}>
        {label}
      </p>
      <p className="text-[15px] leading-7" style={{ color: INK }}>
        {text}
      </p>

  );
}

// ---------- 「事件の真相」モード用: 文章構造の図解 ----------
const STRUCTURE_ROLE_META = {
  reason: { label: "理由", color: GOOD },
  example: { label: "具体例", color: SKY },
  support: { label: "背景・補足", color: PLUM },
};

// ---------- 「事件の真相」モード用: 要旨を見つける考え方ステップ ----------
const SUMMARY_STEPS = [
  {
    title: "くり返し出てくる言葉をさがす",
    body: "文章の中で何度も出てくる言葉や話題は、事件の「主犯」(中心テーマ)であることが多いよ。",
  },
  {
    title: "合図の言葉のうしろをチェックする",
    body: "「しかし」「だから」「つまり」「こうして」のうしろには、たいてい大事な結論(真相)が書かれているよ。",
  },
  {
    title: "それぞれの文が「証拠」か「真相」かを見分ける",
    body: "下の図の色分けを見てみよう。「具体例」や「理由」は真相を裏づける証拠、真ん中の「主題」が事件の真相だよ。",
  },
  {
    title: "選択肢が「せますぎないか」をチェックする",
    body: "一つの証拠(具体例)だけを指している選択肢は、真相ではなく手がかりの一つにすぎないよ。すべての証拠をまとめられている選択肢を選ぼう。",
  },
];

function SummaryStepsGuide() {
  return (
    <div className="rounded-md p-4 mb-3" style={{ backgroundColor: `${INK}08`, border: `1px dashed ${INK}55` }}>
      <p className="text-xs font-bold mb-2" style={{ color: INK }}>
        🔎 真相(要旨)を見つける考え方
      </p>
      <div className="space-y-2">
        {SUMMARY_STEPS.map((step, i) => (
          <div key={i} className="flex items-start gap-2">
            <span
              className="shrink-0 w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center mt-0.5"
              style={{ backgroundColor: BRASS, color: "#fff" }}
            >
              {i + 1}
            </span>
            <div>
              <p className="text-xs font-bold" style={{ color: INK }}>
                {step.title}
              </p>
              <p className="text-xs mt-0.5" style={{ color: INK, opacity: 0.8 }}>
                {step.body}
              </p>
            </div>
          </div>
        ))}
      </div>
    </div>

}

function StructureDiagram({ structure, mainText }) {
  const groups = { reason: [], example: [], support: [] };
  structure.forEach((s) => {
    if (groups[s.role]) groups[s.role].push(s.text);
  });
  const order = ["example", "reason", "support"];
  return (
    <div className="rounded-md p-4" style={{ backgroundColor: "#fff", border: `1px solid ${INK}22` }}>
      <div className="text-center mb-4">
        <p className="text-[10px] font-bold tracking-widest mb-1" style={{ color: BRASS }}>
          主題(このお話の結論)
        </p>
        <div
          className="inline-block rounded-md px-4 py-2 text-sm font-bold max-w-full"
          style={{ border: `2px solid ${BRASS}`, backgroundColor: `${BRASS}12`, color: INK }}
        >
          {mainText}
        </div>
      </div>
      <div className="grid sm:grid-cols-3 gap-4">
        {order
          .filter((key) => groups[key].length > 0)
          .map((key) => {
            const meta = STRUCTURE_ROLE_META[key];
            return (
              <div key={key}>
                <div className="text-center text-xs font-bold mb-1.5" style={{ color: meta.color }}>
                  ↑ {meta.label}
                </div>
                <div className="space-y-1.5">
                  {groups[key].map((text, i) => (
                    <div
                      key={i}
                      className="text-xs rounded px-2.5 py-2 leading-5"
                      style={{ backgroundColor: `${meta.color}0F`, borderLeft: `3px solid ${meta.color}`, color: INK }}
                    >
                      {text}
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
      </div>
    </div>
  );
}

function Result({ mode, score, total, onRetry, onHome }) {
  const ratio = score / total;
  const message =
    ratio === 1
      ? "全問正解!つながりを完ぺきに見ぬいたね。"
      : ratio >= 0.6
      ? "だいぶ手がかりをつかめてきたね。まちがえた問題をもう一度見てみよう。"
      : "練習を始めたばかりだよ。もう一度チャレンジしてみよう。";
  return (
    <div className="text-center py-10">
      <p className="text-xs font-bold tracking-widest mb-2" style={{ color: INK, opacity: 0.6 }}>
        CASE CLOSED
      </p>
      <h2 className="text-2xl font-bold mb-4" style={{ color: INK }}>
        {mode.title}・結果
      </h2>
      <div className="inline-block rounded-sm px-8 py-6 mb-5 shadow-md" style={{ backgroundColor: PAPER, border: `1px solid ${INK}22` }}>
        <p className="text-4xl font-bold" style={{ color: mode.accent }}>
          {score} / {total}
        </p>
      </div>
      <p className="text-sm mb-8 max-w-md mx-auto" style={{ color: INK }}>
        {message}
      </p>
      <div className="flex gap-3 justify-center">
        <button onClick={onRetry} className="rounded-md px-5 py-2 font-bold text-white focus:outline-none focus-visible:ring-4 focus-visible:ring-yellow-300" style={{ backgroundColor: mode.accent }}>
          もう一度挑戦
        </button>
        <button onClick={onHome} className="rounded-md px-5 py-2 font-bold focus:outline-none focus-visible:ring-4 focus-visible:ring-yellow-300" style={{ backgroundColor: "#fff", color: INK, border: `1px solid ${INK}33` }}>
          局にもどる
        </button>
      </div>
    </div>
  );
}

// ---------- Day(20日間カリキュラム)セッション ----------
function DaySession({ dayNumber, total, idx, question, selected, elapsedSec, onChoose, onNext, onStopEarly, onBack }) {
  const isPassageMode = "passage" in question;
  const [hintOpen, setHintOpen] = useState(false);
  useEffect(() => {
    setHintOpen(false);
  }, [idx]);
  const matchedHints = getMatchedHints(question);
  const hintsToShow = matchedHints.length > 0 ? matchedHints : null;
  const correctIndex = question.options.findIndex((o) => o.correct);
  const notesToShow = selected === null ? [] : question.options[selected].correct ? [selected] : [selected, correctIndex];
  const targetSec = 60 * 60;
  const overTime = elapsedSec >= targetSec;

  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <button onClick={onBack} className="flex items-center gap-1 text-sm font-semibold focus:outline-none focus-visible:ring-2 focus-visible:ring-yellow-300 rounded px-1" style={{ color: INK }}>
          <ArrowLeft size={16} /> 局にもどる
        </button>
        <span className="text-xs font-bold flex items-center gap-1" style={{ color: overTime ? BAD : INK }}>
          <Clock size={14} /> {formatMMSS(elapsedSec)} / 60:00
        </span>
      </div>

      <div className="w-full h-1.5 rounded-full mb-4 overflow-hidden" style={{ backgroundColor: "#ffffff88" }}>
        <div className="h-full rounded-full" style={{ width: `${Math.min(100, (elapsedSec / targetSec) * 100)}%`, backgroundColor: overTime ? BAD : BRASS }} />
      </div>

      <div className="flex items-center justify-between mb-4">
        <span className="text-xs font-bold px-2 py-1 rounded-full" style={{ backgroundColor: `${question.modeAccent}22`, color: question.modeAccent }}>
          {question.modeTitle}
        </span>
        <span className="text-xs font-bold" style={{ color: INK }}>
          Day {dayNumber}・第{idx + 1}問 / 全{total}問
        </span>
      </div>

      {overTime && selected === null && (
        <p className="text-xs mb-4 rounded-sm px-4 py-2" style={{ backgroundColor: "#fff", color: BAD, border: `1px dashed ${BAD}` }}>
          もう60分たったよ。キリのいいところで「きょうはここまで」を押してもいいよ。
        </p>
      )}

      <QuestionBody question={question} isPassageMode={isPassageMode} accent={question.modeAccent} />

      <p className="font-bold mb-3" style={{ color: INK }}>
        {question.prompt}
      </p>

      <HintButton hintOpen={hintOpen} setHintOpen={setHintOpen} hintsToShow={hintsToShow} fallbackHint="つなぎ言葉や、問いの最後の言葉に注目しよう。" />

      <OptionsList question={question} selected={selected} onChoose={onChoose} />

      {selected !== null && (
        <AnswerFeedback question={question} selected={selected} notesToShow={notesToShow} onNext={onNext} isLast={idx + 1 >= total} />
      )}

      <button
        onClick={onStopEarly}
        className="mt-4 w-full text-xs font-semibold underline text-center"
        style={{ color: INK, opacity: 0.6 }}
      >
        きょうはここまでにする
      </button>
    </div>
  );
}

function DaySummary({ dayNumber, answers, elapsedSec, onHome }) {
  const total = answers.length;
  const correct = answers.filter((a) => a.correct).length;
  const byMode = {};
  answers.forEach((a) => {
    if (!byMode[a.mode]) byMode[a.mode] = { correct: 0, total: 0 };
    byMode[a.mode].total += 1;
    if (a.correct) byMode[a.mode].correct += 1;
  });
  const modeTitleMap = Object.fromEntries(MODES.map((m) => [m.id, { title: m.title, accent: m.accent }]));

  return (
    <div className="text-center py-8">
      <p className="text-xs font-bold tracking-widest mb-2" style={{ color: INK, opacity: 0.6 }}>
        DAY {dayNumber} CASE CLOSED
      </p>
      <h2 className="text-2xl font-bold mb-4" style={{ color: INK }}>
        今日の結果
      </h2>
      <div className="inline-block rounded-sm px-8 py-6 mb-3 shadow-md" style={{ backgroundColor: PAPER, border: `1px solid ${INK}22` }}>
        <p className="text-4xl font-bold" style={{ color: BRASS }}>
          {correct} / {total}
        </p>
      </div>
      <p className="text-sm mb-6" style={{ color: INK }}>
        今日の学習時間: 約{Math.round(elapsedSec / 60)}分
      </p>

      {total > 0 && (
        <div className="max-w-sm mx-auto text-left space-y-2 mb-8">
          {Object.entries(byMode).map(([modeId, v]) => (
            <div key={modeId} className="flex items-center justify-between text-sm rounded-md px-4 py-2" style={{ backgroundColor: "#fff", border: `1px solid ${INK}22` }}>
              <span style={{ color: modeTitleMap[modeId]?.accent || INK }}>{modeTitleMap[modeId]?.title || modeId}</span>
              <span style={{ color: INK }} className="font-bold">
                {v.correct} / {v.total}
              </span>
            </div>
          ))}
        </div>
      )}

      <button onClick={onHome} className="rounded-md px-6 py-3 font-bold text-white focus:outline-none focus-visible:ring-4 focus-visible:ring-yellow-300" style={{ backgroundColor: INK }}>
        ホームにもどる
      </button>
    </div>
  );
}

function ParentDashboard({ data, onBack }) {
  const { logs, dayStatus } = data;
  const totalQuestions = logs.length;
  const totalCorrect = logs.filter((l) => l.correct).length;
  const overallAccuracy = totalQuestions > 0 ? Math.round((totalCorrect / totalQuestions) * 100) : 0;
  const completedDays = Object.values(dayStatus).filter((d) => d.completed).length;
  const totalTimeMin = Math.round(Object.values(dayStatus).reduce((s, d) => s + (d.timeSec || 0), 0) / 60);

  const byMode = {};
  logs.forEach((l) => {
    if (!byMode[l.mode]) byMode[l.mode] = { correct: 0, total: 0 };
    byMode[l.mode].total += 1;
    if (l.correct) byMode[l.mode].correct += 1;
  });
  const modeInfo = Object.fromEntries(MODES.map((m) => [m.id, { title: m.title, accent: m.accent }]));

  const exportLogsCSV = () => {
    const header = "date,day,mode,correct\n";
    const rows = logs.map((l) => `${l.date},${l.day},${l.mode},${l.correct ? 1 : 0}`).join("\n");
    const ok = downloadTextFile("reading-detective-logs.csv", header + rows);
    if (!ok) alert("ダウンロードに失敗しました。もう一度お試しください。");
  };

  const exportDaySummaryCSV = () => {
    const header = "day,completed,correct_count,total_count,accuracy_percent,time_minutes,play_count,last_played\n";
    const rows = Array.from({ length: TOTAL_DAYS }, (_, i) => i + 1)
      .map((d) => {
        const st = dayStatus[d];
        if (!st) return `${d},0,0,0,0,0,0,`;
        const acc = st.totalCount > 0 ? Math.round((st.correctCount / st.totalCount) * 100) : 0;
        return `${d},${st.completed ? 1 : 0},${st.correctCount},${st.totalCount},${acc},${Math.round((st.timeSec || 0) / 60)},${st.playCount || 0},${st.lastPlayedISO || ""}`;
      })
      .join("\n");
    const ok = downloadTextFile("reading-detective-day-summary.csv", header + rows);
    if (!ok) alert("ダウンロードに失敗しました。もう一度お試しください。");
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-5">
        <button onClick={onBack} className="flex items-center gap-1 text-sm font-semibold focus:outline-none focus-visible:ring-2 focus-visible:ring-yellow-300 rounded px-1" style={{ color: INK }}>
          <ArrowLeft size={16} /> 局にもどる
        </button>
        <h2 className="font-bold text-lg flex items-center gap-2" style={{ color: INK }}>
          <BarChart3 size={18} /> 保護者向けサマリー

            <Download size={14} /> 問題ごとのログ(CSV)
          </button>
          <button onClick={exportDaySummaryCSV} className="flex-1 flex items-center justify-center gap-2 rounded-md px-4 py-2 font-bold text-white text-sm focus:outline-none focus-visible:ring-4 focus-visible:ring-yellow-300" style={{ backgroundColor: SKY }}>
            <Download size={14} /> 日ごとのまとめ(CSV)
          </button>
        </div>
        <p className="text-[11px] mt-2" style={{ color: INK, opacity: 0.6 }}>
          ダウンロードしたCSVをGoogleスプレッドシートなどに読み込んで分析できます。
        </p>
      </div>
    </div>
  );
}

function StatCard({ label, value, accent }) {
  return (
    <div className="rounded-sm shadow-md p-3 text-center" style={{ backgroundColor: PAPER, border: `1px solid ${INK}22` }}>
      <p className="text-[10px] font-bold mb-1" style={{ color: INK, opacity: 0.6 }}>
        {label}
      </p>
      <p className="text-lg font-bold" style={{ color: accent }}>
        {value}
      </p>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<ReadingDetectiveApp />);
</script>
<script>
  (function () {
    var src = document.getElementById('app-source').textContent;
    try {
      var result = Babel.transform(src, {
        presets: [["react", { runtime: "classic" }]]
      });
      var s = document.createElement('script');
      s.textContent = result.code;
      document.body.appendChild(s);
    } catch (e) {
      document.getElementById('root').innerHTML =
        '<pre style="color:red;white-space:pre-wrap;padding:16px;">起動エラー: ' +
        (e && e.message ? e.message : String(e)) + '</pre>';
      console.error(e);
    }
  })();
</script>
</body>
</html>
